name: Build Fully Offline Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare fully offline content
        run: |
          python -m pip install --quiet pillow requests pypdf
          python scripts/generate_launcher_icons.py
          python scripts/build_offline_assets.py
          echo "Offline assets:"
          du -sh app/src/main/assets
          find app/src/main/assets -type f | wc -l

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate offline JavaScript
        run: node --check app/src/main/assets/app.js

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains offline assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/catalog.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/1.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/114.json"
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not exist in offline APK"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Majelis_Mengaji_OFFLINE_v2.0.0.apk
          gh release delete offline-v2.0.0 -y --cleanup-tag || true
          gh release create offline-v2.0.0 Majelis_Mengaji_OFFLINE_v2.0.0.apk \
            --target "${GITHUB_SHA}" \
            --title "Majelis Mengaji OFFLINE v2.0.0" \
            --notes "APK offline penuh dengan tampilan Majelis Mengaji dipulihkan. Quran 114 surah, BaAlwi, Al-Khulasah, Maulid, Yasin, Tahlil, Simtud Duror dan jadwal sholat Palembang bekerja lokal. Tanpa sinkronisasi, tanpa permission internet, tanpa kompas kiblat."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Majelis-Mengaji-OFFLINE-v2.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
