name: Build Fully Offline Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare fully offline content
        run: |
          python -m pip install --quiet pillow requests pypdf
          python scripts/generate_launcher_icons.py
          python scripts/build_offline_assets.py
          echo "Offline assets:"
          du -sh app/src/main/assets
          find app/src/main/assets -type f | wc -l

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate vertical-only offline UI
        run: |
          node --check app/src/main/assets/app.js
          grep -q '.menu-grid{display:grid;grid-template-columns:1fr;' app/src/main/assets/style.css
          grep -q '.collection-row{display:grid;grid-template-columns:1fr;' app/src/main/assets/style.css
          grep -q '.praybox{display:grid;grid-template-columns:1fr;' app/src/main/assets/style.css
          grep -q 'class="pdfpages"' app/src/main/assets/app.js
          if grep -q 'grid-template-columns:1fr 1fr' app/src/main/assets/style.css; then
            echo "ERROR: two-column content layout still exists"
            exit 1
          fi
          if grep -q '.collection-row{display:flex' app/src/main/assets/style.css; then
            echo "ERROR: horizontal collection row still exists"
            exit 1
          fi

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains offline assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/catalog.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/1.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/114.json"
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not exist in offline APK"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Majelis_Mengaji_OFFLINE_v2.0.2.apk
          gh release delete offline-v2.0.2 -y --cleanup-tag || true
          gh release create offline-v2.0.2 Majelis_Mengaji_OFFLINE_v2.0.2.apk \
            --target "${GITHUB_SHA}" \
            --title "Majelis Mengaji OFFLINE v2.0.2" \
            --notes "APK offline penuh v2.0.2. Semua konten aplikasi disusun satu kolom dan hanya scroll vertikal: Menu Utama, Koleksi Offline, jadwal sholat, daftar surah, daftar kitab, dan pembaca PDF kontinu ke bawah. Tanpa horizontal scroll, tanpa permission internet, tanpa kompas kiblat."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Majelis-Mengaji-OFFLINE-v2.0.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
