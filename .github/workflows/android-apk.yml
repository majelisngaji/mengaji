name: Build Fully Offline Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare fully offline content
        run: |
          python -m pip install --quiet pillow requests pypdf
          python scripts/generate_launcher_icons.py
          python scripts/build_offline_assets.py
          echo "Offline assets:"
          du -sh app/src/main/assets
          find app/src/main/assets -type f | wc -l

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate final mockup UI
        run: |
          node --check app/src/main/assets/app.js
          grep -q 'class="mn-topbar"' app/src/main/assets/index.html
          grep -q 'id="topSearch"' app/src/main/assets/index.html
          grep -q '.mn-hero{' app/src/main/assets/style.css
          grep -q '.mn-quick-cards{' app/src/main/assets/style.css
          grep -q '.mn-menu-grid{display:grid;grid-template-columns:repeat(2' app/src/main/assets/style.css
          grep -q '.mn-bottom-nav{position:fixed' app/src/main/assets/style.css
          grep -q 'brand/logo.webp' app/src/main/assets/index.html
          test -f app/src/main/assets/brand/logo.webp
          for bad in "Bacaan Offline" "Koleksi Offline" "Koleksi Bacaan" "tanpa API" "tersimpan di APK" ">Buka<" ">Baca<"; do
            if grep -qi "$bad" app/src/main/assets/index.html app/src/main/assets/app.js; then
              echo "ERROR: unwanted UI text remains: $bad"
              exit 1
            fi
          done
          if grep -q 'overflow-x:auto' app/src/main/assets/style.css; then
            echo "ERROR: horizontal scrolling must not exist"
            exit 1
          fi
          grep -q 'class="mn-row"' app/src/main/assets/app.js
          grep -q 'class="mn-pdf-pages"' app/src/main/assets/app.js

      - name: Render real home preview
        run: |
          python3 -m http.server 8080 --directory app/src/main/assets > /tmp/majelis-preview.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "ERROR: Chrome/Chromium not available for real preview"
            kill $SERVER_PID || true
            exit 1
          fi
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=430,932 --force-device-scale-factor=1 \
            --virtual-time-budget=8000 \
            --screenshot=Majelis_Mengaji_v2.3.0_PREVIEW.png \
            http://127.0.0.1:8080/index.html
          kill $SERVER_PID || true
          test -s Majelis_Mengaji_v2.3.0_PREVIEW.png
          ls -lh Majelis_Mengaji_v2.3.0_PREVIEW.png

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains offline assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/catalog.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/1.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/114.json"
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not exist in offline APK"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Majelis_Mengaji_OFFLINE_v2.3.0.apk
          gh release delete offline-v2.3.0 -y --cleanup-tag || true
          gh release create offline-v2.3.0 Majelis_Mengaji_OFFLINE_v2.3.0.apk Majelis_Mengaji_v2.3.0_PREVIEW.png \
            --target "${GITHUB_SHA}" \
            --title "Majelis Mengaji OFFLINE v2.3.0" \
            --notes "v2.3.0 dibangun dari UI mockup final. Release menyertakan screenshot preview nyata yang dirender dari source aplikasi yang sama."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Majelis-Mengaji-OFFLINE-v2.3.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Majelis_Mengaji_v2.3.0_PREVIEW.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
