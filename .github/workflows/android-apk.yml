name: Build Fully Offline Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare fully offline content
        run: |
          python -m pip install --quiet pillow requests pypdf
          python scripts/generate_launcher_icons.py
          python scripts/build_offline_assets.py
          echo "Offline assets:"
          du -sh app/src/main/assets
          find app/src/main/assets -type f | wc -l

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate UI, titles, back and reader
        run: |
          node --check app/src/main/assets/app.js
          test -f app/src/main/assets/title_audit.json
          grep -q 'window.handleNativeBack' app/src/main/assets/app.js
          grep -q 'evaluateJavascript' app/src/main/java/com/mrobbie/majelismengaji/MainActivity.java
          grep -q 'mn-force-reader-style' app/src/main/assets/app.js
          grep -q 'overflow-x:hidden!important' app/src/main/assets/app.js
          grep -q 'visibleEntries' app/src/main/assets/app.js
          python - <<'PY'
          import json,re,sys
          p='app/src/main/assets/title_audit.json'
          d=json.load(open(p,encoding='utf-8'))
          bad=[]
          for src,v in d.items():
              for t in v.get('titles',[]):
                  if any(x in t for x in ['�','Ã','Â','â€','http://','https://','www.']):
                      bad.append((src,t))
                  if re.fullmatch(r'\s*\d{1,4}(?:[_ -](?:en|in|id|ar))?\s*',t,re.I):
                      bad.append((src,t))
                  if len(t.strip())<3 or len(t)>95:
                      bad.append((src,t))
          print('TITLE AUDIT:', {k:{x:v[x] for x in ['total','visible','hiddenEnglish','generic']} for k,v in d.items()})
          if bad:
              print('BAD TITLES:',bad[:50])
              sys.exit(1)
          PY
          for bad in "Bacaan Offline" "Koleksi Offline" "Koleksi Bacaan" "tanpa API" "tersimpan di APK" ">Buka<" ">Baca<"; do
            if grep -qi "$bad" app/src/main/assets/index.html app/src/main/assets/app.js; then
              echo "ERROR: unwanted UI text remains: $bad"
              exit 1
            fi
          done
          if grep -q 'overflow-x:auto' app/src/main/assets/style.css; then
            echo "ERROR: horizontal scrolling must not exist"
            exit 1
          fi

      - name: Render real previews
        run: |
          python3 -m http.server 8080 --directory app/src/main/assets > /tmp/majelis-preview.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "ERROR: Chrome/Chromium not available"
            kill $SERVER_PID || true
            exit 1
          fi
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --window-size=430,932 --force-device-scale-factor=1             --virtual-time-budget=8000             --screenshot=Majelis_Mengaji_v2.4.0_HOME.png             http://127.0.0.1:8080/index.html
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --window-size=430,1600 --force-device-scale-factor=1             --virtual-time-budget=10000             --screenshot=Majelis_Mengaji_v2.4.0_SIMTUD.png             "http://127.0.0.1:8080/index.html?preview=simtud"
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars             --window-size=430,1600 --force-device-scale-factor=1             --virtual-time-budget=10000             --screenshot=Majelis_Mengaji_v2.4.0_BAALWI.png             "http://127.0.0.1:8080/index.html?preview=baalwi"
          kill $SERVER_PID || true
          test -s Majelis_Mengaji_v2.4.0_HOME.png
          test -s Majelis_Mengaji_v2.4.0_SIMTUD.png
          test -s Majelis_Mengaji_v2.4.0_BAALWI.png
          ls -lh Majelis_Mengaji_v2.4.0_*.png

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains offline assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/catalog.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/1.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/114.json"
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not exist in offline APK"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Majelis_Mengaji_OFFLINE_v2.4.0.apk
          gh release delete offline-v2.4.0 -y --cleanup-tag || true
          cp app/src/main/assets/title_audit.json Majelis_Mengaji_v2.4.0_TITLE_AUDIT.json
          gh release create offline-v2.4.0 Majelis_Mengaji_OFFLINE_v2.4.0.apk Majelis_Mengaji_v2.4.0_HOME.png Majelis_Mengaji_v2.4.0_SIMTUD.png Majelis_Mengaji_v2.4.0_BAALWI.png Majelis_Mengaji_v2.4.0_TITLE_AUDIT.json \
            --target "${GITHUB_SHA}" \
            --title "Majelis Mengaji OFFLINE v2.4.0" \
            --notes "v2.4.0: tombol Back diperbaiki agar tidak menutup aplikasi, reader Rawindroid dipaksa responsif agar teks tidak terpotong, dan seluruh judul katalog diaudit/dibersihkan. Release menyertakan preview HOME, SIMTUD, BAALWI dan laporan audit judul."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Majelis-Mengaji-OFFLINE-v2.4.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Majelis_Mengaji_v2.4.0_HOME.png
            Majelis_Mengaji_v2.4.0_SIMTUD.png
            Majelis_Mengaji_v2.4.0_BAALWI.png
            app/src/main/assets/title_audit.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
