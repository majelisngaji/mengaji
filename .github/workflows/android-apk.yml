name: Build Fully Offline Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare fully offline content
        run: |
          python -m pip install --quiet pillow requests pypdf
          python scripts/generate_launcher_icons.py
          python scripts/build_offline_assets.py
          echo "Offline assets:"
          du -sh app/src/main/assets
          find app/src/main/assets -type f | wc -l

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Majelis plugin-look offline UI
        run: |
          node --check app/src/main/assets/app.js
          grep -q 'class="mn-topbar"' app/src/main/assets/index.html
          grep -q 'class="mn-bottom-nav"' app/src/main/assets/index.html
          grep -q '.mn-hero{' app/src/main/assets/style.css
          grep -q '.mn-menu-grid{display:grid;grid-template-columns:repeat(2' app/src/main/assets/style.css
          grep -q '.mn-menu-card{' app/src/main/assets/style.css
          grep -q '.mn-reading-card' app/src/main/assets/style.css || true
          grep -q 'brand/logo.webp' app/src/main/assets/index.html
          test -f app/src/main/assets/brand/logo.webp
          if grep -q '>Buka<' app/src/main/assets/app.js; then
            echo "ERROR: Buka text must not exist"
            exit 1
          fi
          if grep -q '>Baca<' app/src/main/assets/app.js; then
            echo "ERROR: Baca text must not exist"
            exit 1
          fi
          if grep -q 'overflow-x:auto' app/src/main/assets/style.css; then
            echo "ERROR: horizontal scrolling must not exist"
            exit 1
          fi
          grep -q 'class="mn-row"' app/src/main/assets/app.js
          grep -q 'class="mn-pdf-pages"' app/src/main/assets/app.js

      - name: Build signed debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains offline assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/index.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/catalog.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/1.json"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/quran/114.json"
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not exist in offline APK"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Majelis_Mengaji_OFFLINE_v2.1.0.apk
          gh release delete offline-v2.1.0 -y --cleanup-tag || true
          gh release create offline-v2.1.0 Majelis_Mengaji_OFFLINE_v2.1.0.apk \
            --target "${GITHUB_SHA}" \
            --title "Majelis Mengaji OFFLINE v2.1.0" \
            --notes "APK offline v2.1.0 dengan tampilan dikembalikan ke gaya plugin Majelis Mengaji: header logo, hero hijau, tombol cepat, Menu Utama dua kolom, kartu putih rounded, dan navigasi bawah. Tidak ada tombol Buka/Baca dan tidak ada horizontal scroll. Quran 114 surah, BaAlwi, Al-Khulasah, serta 6 Maulid Rawindroid tetap lokal/offline."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Majelis-Mengaji-OFFLINE-v2.1.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
