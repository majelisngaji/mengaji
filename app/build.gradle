plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrobbie.majelismengaji'
    compileSdk 35

    defaultConfig {
        applicationId "com.mrobbie.majelismengaji"
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName "2.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
        }
    }

    androidResources {
        noCompress += ['pdf', 'mp3', 'm4a', 'aac', 'ogg', 'oga', 'wav']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
